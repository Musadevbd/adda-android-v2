name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: unzip -o "adda-android-v2 (1).zip"

      - name: Fix missing launcher icons
        working-directory: adda-android-v2
        run: sed -i -E 's/ android:(icon|roundIcon)="@mipmap\/ic_launcher(_round)?"//g' app/src/main/AndroidManifest.xml

      - name: Fix compose compiler version
        working-directory: adda-android-v2
        run: sed -i "s/kotlinCompilerExtensionVersion '1.7.2'/kotlinCompilerExtensionVersion '1.5.13'/" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: adda-android-v2
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adda-debug-apk
          path: adda-android-v2/app/build/outputs/apk/debug/app-debug.apk
