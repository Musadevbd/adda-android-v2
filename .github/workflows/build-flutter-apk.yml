name: Build Flutter APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Flutter project
        run: unzip -o "adda-flutter.zip"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build APK
        working-directory: adda-flutter
        run: flutter pub get && flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adda-flutter-apk
          path: adda-flutter/build/app/outputs/flutter-apk/app-debug.apk
