name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Android project
        run: unzip -o "adda-android-v3.zip" || unzip -o "adda-android-v2 (1).zip" || unzip -o *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: adda-android-v3
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adda-debug-apk
          path: adda-android-v3/app/build/outputs/apk/debug/app-debug.apk
