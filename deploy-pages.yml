name: Deploy Flutter web to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['adda-flutter-web.zip']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Flutter web build
        run: |
          unzip -o adda-flutter-web.zip
          mkdir -p pages-site/build
          if [ -d build/web ]; then cp -r build/web pages-site/build/web; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
